name: Build & push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (e.g. 1.0)"
        required: true
        default: "1.0"

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/email-triage

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Quarkus package
        run: ./mvnw -B package -DskipTests

      - uses: docker/setup-qemu-action@v3   # needed for linux/arm64 emulation

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.inputs.version || 'latest' }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
