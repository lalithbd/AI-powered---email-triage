name: Build & push Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/email-triage

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build native executable
        run: ./mvnw -B package -Dnative -Dquarkus.native.container-build=true -DskipTests

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PIPELINE_TOKEN }}

      - name: Resolve image version
        id: meta
        run: |
          APP_VERSION=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${APP_VERSION}-b${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build & push (amd64)
        run: |
          docker build -f Dockerfile.native-micro \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ steps.meta.outputs.version }} \
            -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ steps.meta.outputs.version }}
          docker push $IMAGE_NAME:${{ github.sha }}
